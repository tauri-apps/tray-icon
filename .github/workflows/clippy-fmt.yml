name: clippy & fmt

on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            cargo-args: --all-targets --all-features
          - platform: macos-latest
            cargo-args: --all-targets --all-features
          - platform: ubuntu-latest
            backend: (gtk)
            cargo-args: --all-targets --features serde,common-controls-v6
          - platform: ubuntu-latest
            backend: (ksni)
            cargo-args: --all-targets --no-default-features --features ksni,serde,common-controls-v6

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
      - name: install system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: cargo clippy ${{ matrix.cargo-args }} -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check
