name: test

on:
  push:
    branches:
      - dev
  pull_request:

env:
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            toolchain: "1.90"
            cargo-args: ""
          - platform: macos-latest
            toolchain: "1.90"
            cargo-args: ""
          - platform: ubuntu-latest
            backend: (libappindicator)
            toolchain: "1.90"
            cargo-args: ""
          - platform: ubuntu-latest
            backend: (ksni)
            toolchain: "1.90"
            cargo-args: --no-default-features --features ksni
          - platform: ubuntu-latest
            backend: (ksni + gtk3)
            toolchain: "1.90"
            cargo-args: --no-default-features --features ksni,muda-gtk3
          - platform: ubuntu-latest
            backend: (ksni + gtk4)
            toolchain: "1.92"
            cargo-args: --no-default-features --features ksni,muda-gtk4

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: install system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgtk-4-dev libayatana-appindicator3-dev dbus-x11 xvfb

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build ${{ matrix.cargo-args }}

      - name: Compile the Linux integration test on the minimum toolchain
        if: matrix.platform == 'ubuntu-latest'
        run: cargo test ${{ matrix.cargo-args }} --test linux_status --no-run

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.cargo-args }}

      - name: Verify Linux status properties and signals on a private bus
        if: matrix.platform == 'ubuntu-latest'
        env:
          TRAY_ICON_TEST_SESSION: '1'
          GSETTINGS_BACKEND: memory
          GIO_USE_VFS: local
          NO_AT_BRIDGE: '1'
        run: dbus-run-session -- xvfb-run -a cargo test ${{ matrix.cargo-args }} --test linux_status -- --ignored
