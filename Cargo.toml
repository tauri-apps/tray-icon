[package]
name = "tray-icon"
version = "0.24.2"
edition = "2021"
description = "Create tray icons for desktop applications"
homepage = "https://github.com/tauri-apps/tray-icon"
repository = "https://github.com/tauri-apps/tray-icon"
license = "MIT OR Apache-2.0"
categories = ["gui"]
rust-version = "1.90"
include = [
  "README.md",
  "build.rs",
  "src/**/*.rs",
  "Cargo.toml",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "LICENSE.spdx",
]

[features]
default = ["muda-libxdo", "libappindicator"]
serde = ["dep:serde", "muda-serde"]
libappindicator = ["dep:dirs", "dep:libappindicator", "muda-gtk3"]
ksni = ["dep:ksni", "muda-snapshot"]
muda-common-controls-v6 = ["muda/common-controls-v6"]
muda-gtk3 = ["muda/gtk3"]
muda-gtk4 = ["muda/gtk4"]
muda-libxdo = ["muda/libxdo"]
muda-serde = ["muda/serde"]
muda-snapshot = ["muda/snapshot"]

[dependencies]
muda = { git = "https://github.com/tauri-apps/muda", branch = "dev", default-features = false }
crossbeam-channel = "0.5"
once_cell = "1"
thiserror = "2"
serde = { version = "1", optional = true }

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = ">=0.60, <=0.61"
features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_SystemServices",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
]

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"netbsd\", target_os = \"openbsd\"))".dependencies]
libappindicator = { version = "0.9", optional = true }
dirs = { version = "6", optional = true }
ksni = { version = "0.3.6", default-features = false, features = [
  "async-io",
  "blocking",
], optional = true }

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"netbsd\", target_os = \"openbsd\"))".dev-dependencies]
gtk = "0.19"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGDirectDisplay",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFRunLoop",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSArray",
  "NSData",
  "NSEnumerator",
  "NSGeometry",
  "NSString",
  "NSThread",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSImage",
  "NSMenu",
  "NSResponder",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }

[target."cfg(any(target_os = \"linux\", target_os = \"macos\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"netbsd\", target_os = \"openbsd\"))".dependencies]
png = "0.18"

[dev-dependencies]
winit = "0.30"
tao = "0.36"
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
